<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo | Virado Num Alho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: #140C16;
      background-image: radial-gradient(circle at 50% 50%, rgba(232, 99, 40, 0.08) 0%, transparent 60%);
      color: #FDF8F2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: #201323;
      border: 1px solid rgba(232, 99, 40, 0.3);
      border-radius: 16px;
      padding: 42px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85);
      text-align: center;
    }
    .brand-badge-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      background: #4E3150;
      border: 2px solid #E86328;
      border-radius: 50%;
      color: #E86328;
      margin-bottom: 16px;
    }
    .brand-badge-logo svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      color: #E86328;
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 28px;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    p {
      color: #A895A5;
      font-size: 13.5px;
      margin-bottom: 26px;
      line-height: 1.5;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: #140C16;
      border: 1px solid rgba(253, 248, 242, 0.15);
      border-radius: 8px;
      color: #FDF8F2;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #E86328;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #E86328;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: filter 0.2s, transform 0.2s;
    }
    button:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }
    #feedback {
      font-size: 13.5px;
      min-height: 20px;
      margin-top: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-badge-logo">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 6.5C18.2 4.4 15.8 3 12 3S5.8 4.4 5 6.5C3.3 7.8 2 9.8 2 12c0 4.4 4.5 8 10 8s10-3.6 10-8c0-2.2-1.3-4.2-3-5.5zM12 18c-4.4 0-8-2.7-8-6 0-1.5.8-2.9 2.2-4 .5 1.5 2.5 3 5.8 3s5.3-1.5 5.8-3c1.4 1.1 2.2 2.5 2.2 4 0 3.3-3.6 6-8 6zm0-10c-2.8 0-4.6-1.1-5-2.2C7.8 4.7 9.8 4 12 4s4.2.7 5 1.8c-.4 1.1-2.2 2.2-5 2.2z"/>
      </svg>
    </div>
    <h1>Área Restrita (Administrador)</h1>
    <p>Entre com seu e-mail e senha para gerenciar os textos e fotos do site.</p>

    <form id="admin-login-form">
      <input type="email" id="login-email" placeholder="E-mail do administrador" required autocomplete="email" />
      <input type="password" id="login-password" placeholder="Senha" required autocomplete="current-password" />
      <button type="submit" id="btn-submit">Entrar no Painel</button>
      <div id="feedback"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://hkfhnoxfggjbuhclpyqt.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZmhub3hmZ2dqYnVoY2xweXF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDkzMTUsImV4cCI6MjEwMzU4NTMxNX0.QivPkzOMTuA2bLi5RFA7bzp2YUwDbOg9xnoQDZ-5fmU'

    const form = document.getElementById('admin-login-form')
    const feedback = document.getElementById('feedback')
    const btn = document.getElementById('btn-submit')

    form.onsubmit = async function(e) {
      e.preventDefault()

      const email = document.getElementById('login-email').value.trim()
      const password = document.getElementById('login-password').value

      btn.disabled = true
      feedback.textContent = 'Verificando credenciais...'
      feedback.style.color = '#E86328'

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ email, password })
        })

        const data = await res.json()

        if (!res.ok) {
          throw new Error(data.error_description || data.msg || data.message || 'E-mail ou senha incorretos.')
        }

        // Grava token no navegador
        localStorage.setItem('va_admin_token', data.access_token)

        feedback.textContent = 'Acesso liberado! Entrando no site...'
        feedback.style.color = '#00E676'

        setTimeout(() => {
          window.location.href = 'index.html'
        }, 500)

      } catch (err) {
        feedback.textContent = 'Erro: ' + err.message
        feedback.style.color = '#FF5252'
        btn.disabled = false
      }
    }
  </script>
</body>
</html>
